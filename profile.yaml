presentation:
  summary: >-
    Oi, sou o Ramon!
    Platform engineer / SRE com 5 anos de experiência (15 anos no total) lidando com workloads kubernetes produtivos, multi-cloud, focados em AWS/AZURE e habilitando times internos a consumir infraestrutura cloud native de forma governada através da definição de Golden Paths, observabilidade por design e entrega centralizada em IDPs (Backstage) que ofertam estes produtos de infraestrutura como código (IAC) ao público de desenvolvedores internos. Para isso, trabalho em soluções que usam stacks modernas e que normalmente incluem Terraform (OpenTofu), GitHub Actions reutilizáveis, Helm charts, templates Backstage e workflows Temporal.io com Golang, além do desenvolvimento e manutenção de scripts e APIs usadas para integração entre serviços.
    Discuto, aprimoro e implemento golden paths para o provisionamento de recursos de cloud e para evolução de temas acerca do ciclo de desenvolvimento de apps e DevEx - tais como code flow, build, teste, deploy - propondo caminhos que garantam observabilidade e acordos de serviço (SLIs, SLOs) desde o nascimento. 
    Por 10 anos atuei como DevOps Engineer e Sysadmin na Força Aérea Brasileira (FAB) como Sargento Especialista em Sistemas de Informação, lidando com operações em infraestrutura, NOC, SOC e sistemas críticos. Também sou formado em Engenharia de Computação desde 2020. 
    Contribuo e participo de diversas comunidades tech em papéis distintos, como organizador do DevOpsDays RJ desde 2021, staff no KCD RJ, participante dos meetups HashiCorp e Docker RJ. Durante a faculdade, fui voluntário na organização de um ArduinoDay e de uma edição da Olimpíada Brasileira de Robótica.
    Antes de tudo isso, eu sou pai, ciclista urbano e jardineiro. Bora falar mais!
    

